<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zevnim - Real Hub Owner</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            cursor: none;
        }

        /* Click To Enter Ekranı */
        #enter-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        #enter-screen h1 {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            letter-spacing: 6px;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        /* Arka Plan Videosu ve Bulanıklık Ayarı */
        #bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            filter: grayscale(100%) contrast(120%) brightness(0.5) blur(6px); 
        }

        #bg-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Ana Profil Kartı */
        #main-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 550px;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            transition: transform 0.1s ease-out;
        }

        /* Sol Üst Medya ve İzleyici Çubuğu */
        #top-bar {
            position: fixed;
            top: 25px;
            left: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
        }

        /* Sağ Üst Türkiye Saati */
        #clock-bar {
            position: fixed;
            top: 25px;
            right: 25px;
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .bar-item {
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
        }

        .bar-item:hover, #clock-bar:hover {
            transform: scale(1.08);
            background: rgba(30, 30, 30, 0.95);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .media-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            padding: 0;
        }

        /* Ses İkonu ve Kırmızı Çizgi Efekti */
        .volume-container {
            position: relative;
            display: inline-flex;
            align-items: center;
            cursor: none;
        }

        .volume-icon-img {
            width: 18px;
            height: 18px;
            object-fit: contain;
            filter: drop-shadow(0 0 2px rgba(255,255,255,0.3));
        }

        .mute-cross {
            position: absolute;
            width: 100%;
            height: 2px;
            background-color: red;
            top: 50%;
            left: 0;
            transform: rotate(-45deg);
            display: none;
            pointer-events: none;
        }

        /* Müzik ve Ses Kaydırıcıları */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            outline: none;
            cursor: none;
        }
        
        #music-progress { width: 110px; }
        #volume-slider { width: 60px; margin-left: -5px; }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
            cursor: none;
        }

        /* Profil Resmi */
        #avatar-container {
            position: relative;
            margin-bottom: 15px;
        }

        #avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* İsim ve Verified Badge */
        #name-line {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 2px;
        }

        #username {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .badge-verified-wrapper {
            position: relative;
            display: inline-block;
        }

        .badge-verified {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1da1f2;
            color: #fff;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
            cursor: none;
            box-shadow: 0 0 8px rgba(29, 161, 242, 0.6);
        }

        .tooltip {
            position: absolute;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            background: rgba(255, 255, 255, 0.95);
            color: #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .badge-verified-wrapper:hover .tooltip {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        #sub-title {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #sub-title img {
            width: 18px;
            height: 18px;
            object-fit: contain;
            filter: drop-shadow(0 0 3px rgba(255,255,255,0.5));
        }

        /* Sosyal Medya Butonları */
        #social-container {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-bottom: 20px;
        }

        .social-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: none;
        }

        .social-btn img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Yetenekler ve Logolar */
        #skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            width: 100%;
        }

        .skill-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .skill-badge img {
            width: 16px;
            height: 16px;
            object-fit: contain;
            filter: drop-shadow(0 0 2px rgba(255,255,255,0.3));
        }

        .skill-badge:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            transform: scale(1.05);
        }

        /* Haç Fare İmleci */
        #cross-cursor {
            position: fixed;
            width: 24px;
            height: 24px;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
        }

        .trail-dot {
            position: fixed;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            animation: fadeOut 0.5s forwards ease-out;
        }

        @keyframes fadeOut {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
        }
    </style>
</head>
<body>

    <!-- Click To Enter Ekranı -->
    <div id="enter-screen" onclick="enterSite()">
        <h1>Click To Enter</h1>
    </div>

    <!-- Arka Plan Videosu -->
    <div id="bg-container">
        <video src="https://github.com/user-attachments/assets/302c4399-4555-483b-925e-3c0df463dfe2" autoplay loop muted playsinline></video>
    </div>

    <!-- Haç Fare İmleci -->
    <div id="cross-cursor">
        <svg viewBox="0 0 24 24" fill="#ffffff" stroke="#000000" stroke-width="1">
            <path d="M11 2h2v6h6v2h-6v12h-2V10H5V8h6V2z"/>
        </svg>
    </div>

    <!-- Klasördeki Yerel Müzik Dosyası -->
    <audio id="bg-music" loop preload="auto">
        <source src="muzik.mp3" type="audio/mpeg">
    </audio>

    <!-- Sol Üst Medya, Ses ve İzleyici Oynatıcı -->
    <div id="top-bar">
        <div class="bar-item">
            <button class="media-btn" id="play-btn" onclick="toggleAudio()">❚❚</button>
            <input type="range" id="music-progress" value="0" min="0" max="100">
            <div class="volume-container" onclick="toggleMute()">
                <img src="https://github.com/user-attachments/assets/73bf1682-4bdc-4079-b9f1-89e84d490f0d" alt="Volume" class="volume-icon-img" id="vol-icon">
                <div class="mute-cross" id="mute-cross-line"></div>
            </div>
            <input type="range" id="volume-slider" value="50" min="0" max="100">
        </div>
        <div class="bar-item">
            <span>👁</span>
            <span id="view-count">25.614</span>
        </div>
    </div>

    <!-- Sağ Üst Türkiye Saati -->
    <div id="clock-bar">
        <span>🕒</span>
        <span id="tr-clock">00:00:00</span>
    </div>

    <!-- Profil Kartı -->
    <div id="main-card">
        <div id="avatar-container">
            <!-- Profil Fotoğrafı -->
            <img id="avatar" src="https://github.com/user-attachments/assets/bd846e52-938c-4c85-a0c6-1bbebf5e4919" alt="Zevnim">
        </div>

        <div id="name-line">
            <span id="username">Zevnim</span>
            <div class="badge-verified-wrapper">
                <div class="badge-verified">✓</div>
                <div class="tooltip">Verified Badge</div>
            </div>
        </div>

        <div id="sub-title">
            <img src="https://github.com/user-attachments/assets/b7b8f3cc-d3c0-4ea3-913a-fc8411f5f7e1" alt="Real Hub Logo">
            <span>Real Hub Owner</span>
        </div>

        <!-- Sosyal Medya Butonları -->
        <div id="social-container">
            <button class="social-btn" onclick="copyToClipboard('zevnim', this, 'Discord')">
                <img src="https://github.com/user-attachments/assets/8109914a-274a-4c43-8a05-3889cd1a6cb5" alt="Discord">
                <span class="btn-text">Discord</span>
            </button>
            <button class="social-btn" onclick="copyToClipboard('therealdoozui', this, 'Instagram')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" alt="Instagram" style="filter: drop-shadow(0 0 2px rgba(255,255,255,0.5));">
                <span class="btn-text">Instagram</span>
            </button>
        </div>

        <!-- Logolar ve Yetenekler -->
        <div id="skills-container">
            <div class="skill-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" alt="Python"> Python Developer
            </div>
            <div class="skill-badge">
                <img src="https://github.com/user-attachments/assets/8109914a-274a-4c43-8a05-3889cd1a6cb5" alt="Discord"> Discord Developer
            </div>
            <div class="skill-badge">
                <img src="https://github.com/user-attachments/assets/af3c2e23-0620-49a8-9af4-9091da364d31" alt="Roblox"> Roblox Developer
            </div>
            <div class="skill-badge">
                <img src="https://github.com/user-attachments/assets/b7b8f3cc-d3c0-4ea3-913a-fc8411f5f7e1" alt="Real Hub"> Real Hub Owner
            </div>
            <div class="skill-badge">
                <img src="https://github.com/user-attachments/assets/796c5190-b396-4c2b-b39c-a6fef8131127" alt="GFX"> GFX Designer
            </div>
            <div class="skill-badge">
                <img src="https://github.com/user-attachments/assets/0181ccd9-7b2e-47a8-a3ae-95eb3b01354f" alt="Video"> Video Editor
            </div>
        </div>
    </div>

    <script>
        const music = document.getElementById('bg-music');
        const progressBar = document.getElementById('music-progress');
        const volumeSlider = document.getElementById('volume-slider');
        const muteCrossLine = document.getElementById('mute-cross-line');
        let isSeeking = false;
        let lastVolume = 0.5;

        music.volume = 0.5;

        // İzleyici Sayacı
        function initViewCounter() {
            let baseViews = 25614;
            let storedViews = localStorage.getItem('site_total_views');
            if (storedViews !== null) {
                baseViews = parseInt(storedViews, 10) + 1;
            }
            localStorage.setItem('site_total_views', baseViews);
            document.getElementById('view-count').innerText = baseViews.toLocaleString('tr-TR');
        }
        initViewCounter();

        /* "Tok" TİK Sesi Efekti */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playClickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc1.type = 'triangle';
            osc2.type = 'sine';
            osc1.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc1.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.035);
            osc2.frequency.setValueAtTime(1200, audioCtx.currentTime);
            osc2.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.02);

            gainNode.gain.setValueAtTime(0.18, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.035);

            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc1.start();
            osc2.start();
            osc1.stop(audioCtx.currentTime + 0.035);
            osc2.stop(audioCtx.currentTime + 0.035);
        }

        document.addEventListener('click', () => playClickSound());

        // Türkiye Saati Canlı Sayaç
        function updateClock() {
            const now = new Date();
            const options = { timeZone: 'Europe/Istanbul', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            document.getElementById('tr-clock').innerText = new Intl.DateTimeFormat('tr-TR', options).format(now);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Metin Kopyalama Fonksiyonu
        function copyToClipboard(text, buttonElement, platformName) {
            navigator.clipboard.writeText(text).then(() => {
                const textSpan = buttonElement.querySelector('.btn-text');
                textSpan.innerText = "Kopyalandı!";
                buttonElement.style.borderColor = "#1da1f2";
                setTimeout(() => {
                    textSpan.innerText = platformName;
                    buttonElement.style.borderColor = "rgba(255, 255, 255, 0.1)";
                }, 1500);
            });
        }

        // Tıklama ile Giriş
        function enterSite() {
            const enterScreen = document.getElementById('enter-screen');
            enterScreen.style.opacity = '0';
            setTimeout(() => enterScreen.style.visibility = 'hidden', 800);
            
            music.play().catch(e => console.log("Müzik hatası: " + e));
        }

        // Play/Pause Kontrolü
        function toggleAudio() {
            const btn = document.getElementById('play-btn');
            if (music.paused) {
                music.play();
                btn.innerText = '❚❚';
            } else {
                music.pause();
                btn.innerText = '▶';
            }
        }

        // Ses Ayarı ve Kırmızı Çizgi Kontrolü
        volumeSlider.addEventListener('input', () => {
            const val = volumeSlider.value / 100;
            music.volume = val;
            if (val === 0) {
                muteCrossLine.style.display = 'block';
            } else {
                muteCrossLine.style.display = 'none';
            }
        });

        // Ses İkonuna Tıklayarak Sesi Kapatma/Açma
        function toggleMute() {
            if (music.volume > 0) {
                lastVolume = music.volume;
                music.volume = 0;
                volumeSlider.value = 0;
                muteCrossLine.style.display = 'block';
            } else {
                music.volume = lastVolume;
                volumeSlider.value = lastVolume * 100;
                muteCrossLine.style.display = 'none';
            }
        }

        // Şarkı Çizgisi 
        music.addEventListener('timeupdate', () => {
            if (!isSeeking && music.duration) {
                progressBar.value = (music.currentTime / music.duration) * 100;
            }
        });

        progressBar.addEventListener('mousedown', () => isSeeking = true);
        progressBar.addEventListener('touchstart', () => isSeeking = true);

        progressBar.addEventListener('input', () => {
            if (music.duration) {
                music.currentTime = (progressBar.value / 100) * music.duration;
            }
        });

        progressBar.addEventListener('mouseup', () => isSeeking = false);
        progressBar.addEventListener('touchend', () => isSeeking = false);

        // Fare ve Efekt Takibi
        const cursor = document.getElementById('cross-cursor');
        let colorToggle = false;

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';

            const dot = document.createElement('div');
            dot.className = 'trail-dot';
            dot.style.left = e.clientX + 'px';
            dot.style.top = e.clientY + 'px';
            
            colorToggle = !colorToggle;
            if (colorToggle) {
                dot.style.background = '#ffffff';
                dot.style.boxShadow = '0 0 8px #ffffff';
            } else {
                dot.style.background = '#000000';
                dot.style.boxShadow = '0 0 8px #000000';
                dot.style.border = '1px solid rgba(255,255,255,0.4)';
            }

            document.body.appendChild(dot);
            setTimeout(() => dot.remove(), 500);

            const card = document.getElementById('main-card');
            const xAxis = (window.innerWidth / 2 - e.clientX) / 30;
            const yAxis = (window.innerHeight / 2 - e.clientY) / 30;
            card.style.transform = `translate(-50%, -50%) rotateY(${xAxis}deg) rotateX(${-yAxis}deg)`;
        });
    </script>
</body>
</html>
